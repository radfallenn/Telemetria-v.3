name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Validate Raspberry Bridge 8788
        run: |
          set -euo pipefail
          node --check bridge/server.js
          sh -n bridge/install.sh
          node <<'NODE'
          const fs=require('fs');
          const server=fs.readFileSync('bridge/server.js','utf8');
          const install=fs.readFileSync('bridge/install.sh','utf8');
          const ok=(value,message)=>{if(!value)throw new Error(message);console.log('OK:',message)};
          ok(server.includes('toPort(process.env.HTTP_PORT, 8788)'),'HTTP padrão 8788');
          ok(server.includes("Buffer.from('A', 'ascii')"),'heartbeat GT7 A');
          ok(server.includes('sameSocket: true'),'heartbeat e recepção no socket GT7');
          ok(server.includes("'/api/restart'"),'endpoint de reinício');
          ok(install.includes('HTTP_PORT: "8788"'),'instalador Raspberry usa 8788');
          ok(install.includes('192.168.1.81'),'IP PS5 padrão');
          NODE
          rm -rf /tmp/telemetria-bridge-ci
          mkdir -p /tmp/telemetria-bridge-ci/data
          HTTP_PORT=18788 UDP_LISTEN_PORT=43740 PS5_HEARTBEAT_PORT=43739 BRIDGE_CONFIG_FILE=/tmp/telemetria-bridge-ci/config.json BRIDGE_DATA_DIR=/tmp/telemetria-bridge-ci/data node bridge/server.js >/tmp/telemetria-bridge-ci/server.log 2>&1 &
          BRIDGE_PID=$!
          trap 'kill "$BRIDGE_PID" 2>/dev/null || true; cat /tmp/telemetria-bridge-ci/server.log' EXIT
          node <<'NODE'
          const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          (async()=>{
            let health;
            for(let attempt=0;attempt<25;attempt+=1){
              try{const response=await fetch('http://127.0.0.1:18788/api/health');health=await response.json();if(response.ok&&health.ok&&health.udpBound)break}catch{}
              await wait(150);
            }
            if(!health||!health.ok||!health.udpBound||health.httpPort!==18788||health.heartbeatByte!=='A'||health.sameSocket!==true)throw new Error('Bridge 8788 não iniciou corretamente: '+JSON.stringify(health));
            const live=await (await fetch('http://127.0.0.1:18788/api/live')).json();
            if(!live.bridge||live.bridge.httpPort!==18788)throw new Error('/api/live não confirmou a Bridge: '+JSON.stringify(live));
            const restarted=await (await fetch('http://127.0.0.1:18788/api/restart',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})).json();
            if(!restarted.ok||!restarted.state?.udp?.bound)throw new Error('Reinício falhou: '+JSON.stringify(restarted));
            console.log('OK: Bridge Raspberry 8788 inicia, entrega /api/live e reinicia');
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE

      - name: Fix windows and card height
        run: node scripts/patch-v4-windows-card-height.js

      - name: Apply independent hard navigation
        run: node scripts/patch-v4-hard-nav.js

      - name: Apply RPM C gauge and full-frame
        run: node scripts/patch-v4-rpm-c-fullframe.js

      - name: Separate RPM total and fuel cards
        run: node scripts/patch-v4-separate-rpm-total-fuel.js

      - name: Apply laps and fuel fixes
        run: node scripts/patch-v4-laps-fuel-references.js

      - name: Apply performance and stability fix
        run: node scripts/patch-v4-performance-stability.js

      - name: Compact cards and section max speed
        run: node scripts/patch-v4-compact-core-cards-section-max.js

      - name: Organize dashboard and add movement arrows
        run: node scripts/patch-v4-grid-arrows-all-attributes.js

      - name: Add total last lap and general average cards
        run: node scripts/patch-v4-total-last-average-cards.js

      - name: Remove card designer and install attribute database
        run: node scripts/patch-v4-remove-designer-expand-attributes.js

      - name: Add attribute checks to dashboard
        run: node scripts/patch-v4-attribute-checkbox-dashboard.js

      - name: Install GT7 Bridge reader
        run: node scripts/install-bridge-from-v408-apk.js

      - name: Connect app to Raspberry Bridge 8788
        run: |
          node --check scripts/patch-v4-editable-network-settings.js
          node scripts/patch-v4-editable-network-settings.js
          node scripts/patch-v4-editable-network-settings.js
      - name: Force app endpoint to Raspberry Bridge 8788
        run: |
          node --check scripts/patch-v4-bridge-8788.js
          node scripts/patch-v4-bridge-8788.js

      - name: Final removal of ATRIB and marked cards
        run: node scripts/patch-v4-remove-attributes-and-marked-cards.js

      - name: Validate final APK web package
        run: |
          set -euo pipefail
          test -s www/index.html
          test -s www/bridge-v408.js
          test -s www/telemetry-attributes.json
          node --check www/bridge-v408.js
          node <<'NODE'
          const fs=require('fs');
          const index=fs.readFileSync('www/index.html','utf8');
          const bridge=fs.readFileSync('www/bridge-v408.js','utf8');
          const attrs=JSON.parse(fs.readFileSync('www/telemetry-attributes.json','utf8'));
          const ok=(value,message)=>{if(!value)throw new Error(message);console.log('OK:',message)};
          const ids=new Set(Array.isArray(attrs)?attrs.map(item=>item&&item.id).filter(Boolean):[]);
          ok(Array.isArray(attrs)&&attrs.length>=48,`${attrs.length} atributos válidos`);
          for(const id of ['speedKmh','rpm','gear','throttlePct','brakePct','fuelPct','bestLapMs','lastLapMs'])ok(ids.has(id),`atributo: ${id}`);
          const bridgeTags=index.match(/<script\b(?=[^>]*\bsrc\s*=\s*["'][^"']*bridge-v408\.js(?:[?#][^"']*)?["'])[^>]*>\s*<\/script>/gi)||[];
          ok(bridgeTags.length===1,`uma única Bridge (${bridgeTags.length})`);
          for(const fn of ['saveNetworkSettings','testBridgeConnection','restartBridgeService','reconnectBridge','stopBridge','getBridgeUrl'])ok(bridge.includes(fn),`função: ${fn}`);
          for(const id of ['setBridgeControl','setBridgeUrl','setPs5Ip','setPollInterval','setSaveReconnect','setTestBridge','setRestartBridge','setStopBridge','setBridgeStatus'])ok(index.includes(id),`SET: ${id}`);
          ok(index.includes('http://192.168.1.70:8788'),'Bridge Raspberry 8788 configurada');
          ok(index.includes('192.168.1.81'),'PS5 padrão configurado');
          ok(bridge.includes("const DEFAULT_BRIDGE = 'http://192.168.1.70:8788'"),'controlador usa 8788');
          ok(!index.includes('http://192.168.1.70:8789'),'Bridge 8789 antiga removida do APK final');
          ok(!index.includes('setUdpPort')&&!index.includes('setHeartbeatPort'),'portas do protocolo ocultas no SET');
          ok((index.match(/V4 SET REBUILD BRIDGE CONTROL UI/g)||[]).length===1,'uma única janela SET');
          ok(!/<section\b[^>]*id=["']attributes["'][^>]*>/i.test(index),'página ATRIB removida');
          ok(!/<button\b[^>]*data-page=["']attributes["'][^>]*>/i.test(index),'botão ATRIB removido');
          for(const field of ['rpmtotal','tyres','last','total'])ok(!new RegExp('<[^>]+data-field=["\\\']'+field+'["\\\']','i').test(index),`card removido: ${field}`);
          NODE

      - name: Add Android
        run: npx cap add android

      - name: Sync
        run: npx cap sync android

      - name: Allow local HTTP network
        run: node scripts/patch-android-network.js

      - name: Validate minimal Android permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$MANIFEST"
          grep -q 'android:usesCleartextTraffic="true"' "$MANIFEST"
          ! grep -q 'TelemetryForegroundService' "$MANIFEST"
          ! grep -q 'android.permission.WAKE_LOCK' "$MANIFEST"
          ! grep -q 'android.permission.FOREGROUND_SERVICE' "$MANIFEST"
          ! grep -q 'android.permission.POST_NOTIFICATIONS' "$MANIFEST"

      - name: Gradle permission
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk "release/GT7-Telemetria-V4.29-Bridge-8788-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GT7-Telemetria-V4.29-Bridge-8788
          path: release/GT7-Telemetria-V4.29-Bridge-8788-debug.apk
