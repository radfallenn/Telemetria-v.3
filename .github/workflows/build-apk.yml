name: Build APK V5 Estável

on:
  workflow_dispatch:
  push:
    branches:
      - telemetria-v5

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Validate new Bridge 8789
        run: |
          set -euo pipefail
          node --check bridge-8789/protocol.js
          node --check bridge-8789/sessions.js
          node --check bridge-8789/server.js
          sh -n bridge-8789/install.sh
          node <<'NODE'
          const fs=require('fs');
          const server=fs.readFileSync('bridge-8789/server.js','utf8');
          const protocol=fs.readFileSync('bridge-8789/protocol.js','utf8');
          const ok=(value,message)=>{if(!value)throw new Error(message);console.log('OK:',message)};
          ok(server.includes('process.env.HTTP_PORT || 8789'),'HTTP padrão 8789');
          ok(server.includes("const HEARTBEAT = Buffer.from('A', 'ascii')"),'heartbeat A');
          ok(server.includes("require('./protocol')"),'protocolo separado');
          ok(protocol.includes('Simulator Interface Packet GT7 ver 0.0'),'decodificador Salsa GT7');
          ok(server.includes("'/api/restart'"),'reinício da Bridge por API');
          ok(server.includes("'GT7 Bridge 8789'"),'identificação da nova Bridge');
          NODE
          rm -rf /tmp/bridge-8789-ci
          mkdir -p /tmp/bridge-8789-ci/data
          HTTP_PORT=18789 UDP_RECEIVE_PORT=43740 PS5_HEARTBEAT_PORT=43739 CONFIG_FILE=/tmp/bridge-8789-ci/config.json DATA_DIR=/tmp/bridge-8789-ci/data node bridge-8789/server.js >/tmp/bridge-8789-ci/server.log 2>&1 &
          BRIDGE_PID=$!
          trap 'kill "$BRIDGE_PID" 2>/dev/null || true; cat /tmp/bridge-8789-ci/server.log' EXIT
          node <<'NODE'
          const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          (async()=>{
            let health;
            for(let attempt=0;attempt<25;attempt+=1){
              try{
                const response=await fetch('http://127.0.0.1:18789/api/health');
                health=await response.json();
                if(response.ok&&health.ok&&health.udpBound)break;
              }catch{}
              await wait(150);
            }
            if(!health||!health.ok||!health.udpBound)throw new Error('Bridge 8789 não iniciou: '+JSON.stringify(health));
            if(health.httpPort!==18789||health.heartbeatByte!=='A')throw new Error('Configuração inesperada: '+JSON.stringify(health));
            const response=await fetch('http://127.0.0.1:18789/api/restart',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
            const restarted=await response.json();
            if(!response.ok||!restarted.ok||!restarted.state?.udp?.bound)throw new Error('Reinício falhou: '+JSON.stringify(restarted));
            console.log('OK: nova Bridge 8789 iniciou e reiniciou');
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE

      - name: Fix windows and card height
        run: node scripts/patch-v4-windows-card-height.js

      - name: Apply independent hard navigation
        run: node scripts/patch-v4-hard-nav.js

      - name: Apply RPM C gauge and full-frame
        run: node scripts/patch-v4-rpm-c-fullframe.js

      - name: Separate RPM total and fuel cards
        run: node scripts/patch-v4-separate-rpm-total-fuel.js

      - name: Apply laps and fuel fixes
        run: node scripts/patch-v4-laps-fuel-references.js

      - name: Apply performance and stability fix
        run: node scripts/patch-v4-performance-stability.js

      - name: Compact cards and section max speed
        run: node scripts/patch-v4-compact-core-cards-section-max.js

      - name: Organize dashboard and add movement arrows
        run: node scripts/patch-v4-grid-arrows-all-attributes.js

      - name: Add total last lap and general average cards
        run: node scripts/patch-v4-total-last-average-cards.js

      - name: Remove card designer and install attribute database
        run: node scripts/patch-v4-remove-designer-expand-attributes.js

      - name: Add attribute checks to dashboard
        run: node scripts/patch-v4-attribute-checkbox-dashboard.js

      - name: Install GT7 Bridge reader
        run: node scripts/install-bridge-from-v408-apk.js

      - name: Connect app to new Bridge 8789
        run: |
          node --check scripts/patch-v4-editable-network-settings.js
          node scripts/patch-v4-editable-network-settings.js
          node scripts/patch-v4-editable-network-settings.js

      - name: Final removal of ATRIB and marked cards
        run: node scripts/patch-v4-remove-attributes-and-marked-cards.js

      - name: Apply stable V5 settings and total time
        run: |
          node --check scripts/patch-v5-stable-settings-total.js
          node scripts/patch-v5-stable-settings-total.js

      - name: Validate final V5 APK web package
        run: |
          set -euo pipefail
          test -s www/index.html
          test -s www/bridge-v408.js
          test -s www/telemetry-attributes.json
          node --check www/bridge-v408.js
          node <<'NODE'
          const fs=require('fs');
          const index=fs.readFileSync('www/index.html','utf8');
          const bridge=fs.readFileSync('www/bridge-v408.js','utf8');
          const attrs=JSON.parse(fs.readFileSync('www/telemetry-attributes.json','utf8'));
          const ok=(value,message)=>{if(!value)throw new Error(message);console.log('OK:',message)};
          const ids=new Set(Array.isArray(attrs)?attrs.map(item=>item&&item.id).filter(Boolean):[]);
          ok(Array.isArray(attrs)&&attrs.length>=48,`${attrs.length} atributos válidos`);
          for(const id of ['speedKmh','rpm','gear','throttlePct','brakePct','fuelPct','bestLapMs','lastLapMs'])ok(ids.has(id),`atributo: ${id}`);
          const bridgeTags=index.match(/<script\b(?=[^>]*\bsrc\s*=\s*["'][^"']*bridge-v408\.js(?:[?#][^"']*)?["'])[^>]*>\s*<\/script>/gi)||[];
          ok(bridgeTags.length===1,`uma única Bridge (${bridgeTags.length})`);
          ok(index.includes('V5 STABLE EDITABLE NETWORK AND TOTAL UI'),'patch V5 instalado');
          for(const id of ['setBridgeControl','setBridgeUrl','setPs5Ip','setPollInterval','setSaveReconnect','setTestBridge','setRestartBridge','setStopBridge','setBridgeStatus'])ok(index.includes(id),`SET editável: ${id}`);
          for(const fn of ['v5BridgeUrl','v5SaveNetworkSettings','v5TestBridge','v5Reconnect','v5Restart','window.gt7V5Network'])ok(bridge.includes(fn),`controlador: ${fn}`);
          ok(bridge.includes('const url = v5BridgeUrl() + path;'),'requisições usam URL salva');
          ok(!/const\s+BRIDGE\s*=/.test(bridge),'sem endereço fixo antigo');
          ok(index.includes('CONEXÃO EDITÁVEL'),'tela de configuração editável');
          ok(index.includes('laps.reduce((sum,ms)=>sum+ms,0)'),'Tempo Total soma todas as voltas');
          ok(index.includes('id="v5TotalValue"'),'card Tempo Total preservado');
          ok(!index.includes("new Set(['rpmtotal','tyres','last','total'])"),'Tempo Total não é removido');
          ok(!/<section\b[^>]*id=["']attributes["'][^>]*>/i.test(index),'página ATRIB removida');
          ok(!/<button\b[^>]*data-page=["']attributes["'][^>]*>/i.test(index),'botão ATRIB removido');
          NODE

      - name: Add Android
        run: npx cap add android

      - name: Sync
        run: npx cap sync android

      - name: Allow local HTTP network
        run: node scripts/patch-android-network.js

      - name: Validate minimal Android permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$MANIFEST"
          grep -q 'android:usesCleartextTraffic="true"' "$MANIFEST"
          ! grep -q 'TelemetryForegroundService' "$MANIFEST"
          ! grep -q 'android.permission.WAKE_LOCK' "$MANIFEST"
          ! grep -q 'android.permission.FOREGROUND_SERVICE' "$MANIFEST"
          ! grep -q 'android.permission.POST_NOTIFICATIONS' "$MANIFEST"

      - name: Gradle permission
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk "release/GT7-Telemetria-V5.1-IPs-Editaveis-Tempo-Total-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GT7-Telemetria-V5.1-IPs-Editaveis-Tempo-Total
          path: release/GT7-Telemetria-V5.1-IPs-Editaveis-Tempo-Total-debug.apk
