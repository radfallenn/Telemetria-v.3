name: Build Telemetria Next

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'telemetria-next/**'
      - '.github/workflows/build-telemetria-next.yml'
  push:
    branches:
      - main
      - agent/telemetria-next-zero
    paths:
      - 'telemetria-next/**'
      - '.github/workflows/build-telemetria-next.yml'

jobs:
  validate-bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telemetria-next/bridge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Bridge source
        run: |
          set -euo pipefail
          node --check src/protocol.js
          node --check src/server.js
          bash -n install.sh
          bash -n install-casaos.sh
          docker compose -f docker-compose.yml config >/dev/null
          ! grep -q 'npm install' Dockerfile
          ! grep -q "require('ws')" src/server.js

      - name: Start isolated Bridge test
        env:
          HTTP_PORT: '18790'
          UDP_RECEIVE_PORT: '43740'
          PS5_HEARTBEAT_PORT: '43739'
          PS5_IP: '127.0.0.1'
          DATA_DIR: '/tmp/gt7-telemetria-next'
        run: |
          set -euo pipefail
          node src/server.js >/tmp/gt7-next-bridge.log 2>&1 &
          BRIDGE_PID=$!
          trap 'kill "$BRIDGE_PID" 2>/dev/null || true; cat /tmp/gt7-next-bridge.log' EXIT
          node <<'NODE'
          const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          (async () => {
            let health;
            for (let attempt = 0; attempt < 30; attempt += 1) {
              try {
                const response = await fetch('http://127.0.0.1:18790/api/health');
                health = await response.json();
                if (response.ok && health.ok && health.udpBound) break;
              } catch {}
              await wait(150);
            }
            if (!health?.ok || !health?.udpBound || health.httpPort !== 18790 || health.version !== '0.3.0') {
              throw new Error(`Bridge inválida: ${JSON.stringify(health)}`);
            }
            const configResponse = await fetch('http://127.0.0.1:18790/api/config', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ ps5Ip: '127.0.0.2' })
            });
            const config = await configResponse.json();
            if (!configResponse.ok || !config.ok || config.config?.ps5Ip !== '127.0.0.2') {
              throw new Error(`Configuração inválida: ${JSON.stringify(config)}`);
            }
            const restartResponse = await fetch('http://127.0.0.1:18790/api/restart', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: '{}'
            });
            const restart = await restartResponse.json();
            if (!restartResponse.ok || !restart.ok || !restart.state?.udpBound) {
              throw new Error(`Reinício UDP inválido: ${JSON.stringify(restart)}`);
            }
            console.log('OK: Bridge Next validada.');
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Validate offline Docker build
        run: docker build --network=none -t gt7-bridge-next:0.3 .

      - name: Prepare CasaOS Bridge package
        run: |
          set -euo pipefail
          rm -rf release/GT7-Bridge-Next-v0.7-CasaOS
          mkdir -p release/GT7-Bridge-Next-v0.7-CasaOS
          cp package.json Dockerfile docker-compose.yml install-casaos.sh install.sh release/GT7-Bridge-Next-v0.7-CasaOS/
          cp -R src release/GT7-Bridge-Next-v0.7-CasaOS/src

      - name: Upload CasaOS Bridge
        uses: actions/upload-artifact@v4
        with:
          name: GT7-Bridge-Next-v0.7-CasaOS
          path: telemetria-next/bridge/release/GT7-Bridge-Next-v0.7-CasaOS

  build-apk:
    runs-on: ubuntu-latest
    needs: validate-bridge
    defaults:
      run:
        working-directory: telemetria-next/app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate almost circular RPM dashboard
        run: |
          set -euo pipefail
          for file in www/index.html www/styles.css www/app.js www/fuel-heatmap.css www/fuel-heatmap.js www/rpm-heatmap.css www/card-layout.css www/card-layout.js www/compact-ui-v06.css www/gauge-v07.css www/gauge-v07.js www/valid-lap-total.js; do
            test -s "$file"
          done
          node --check www/app.js
          node --check www/fuel-heatmap.js
          node --check www/card-layout.js
          node --check www/gauge-v07.js
          node --check www/valid-lap-total.js
          grep -q 'id="maxSpeedGauge"' www/index.html
          grep -q 'id="rpmProgressArc"' www/index.html
          grep -q 'gauge-v07.css' www/index.html
          grep -q 'gauge-v07.js' www/index.html
          grep -q 'valid-lap-total.js' www/index.html
          grep -q 'card-layout.js' www/index.html
          grep -q 'ARC_DEGREES = 300' www/gauge-v07.js
          grep -q 'START_ANGLE = -150' www/gauge-v07.js
          grep -q -- '--rpm-progress' www/gauge-v07.css
          grep -q 'nth-child(n+31)' www/rpm-heatmap.css
          grep -q 'session.validLapTimes.reduce' www/valid-lap-total.js
          grep -q 'value.valid === false' www/valid-lap-total.js
          grep -q 'data-layout-move="${direction}"' www/card-layout.js
          grep -q "\['up', '▲'" www/card-layout.js
          grep -q "\['left', '◀'" www/card-layout.js
          grep -q "\['right', '▶'" www/card-layout.js
          grep -q "\['down', '▼'" www/card-layout.js
          grep -q 'http://192.168.1.70:8790' www/app.js
          grep -q '/api/config' www/app.js
          ! grep -q 'bridge-v408.js' www/index.html
          ! grep -q 'patch-v4' www/index.html
          ! grep -q 'new WebSocket' www/app.js

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Allow local HTTP network
        run: |
          python3 <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          if 'android.permission.INTERNET' not in text:
              text = text.replace('<application', '<uses-permission android:name="android.permission.INTERNET" />\n    <application', 1)
          if 'android.permission.ACCESS_NETWORK_STATE' not in text:
              text = text.replace('<application', '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <application', 1)
          if 'android:usesCleartextTraffic=' not in text:
              text = text.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          manifest.write_text(text, encoding='utf-8')
          PY
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_NETWORK_STATE' android/app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/GT7-Telemetria-Next-v0.7-RPM-Circulo-Quase-Completo-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GT7-Telemetria-Next-v0.7-RPM-Circulo-Quase-Completo
          path: telemetria-next/app/release/GT7-Telemetria-Next-v0.7-RPM-Circulo-Quase-Completo-debug.apk
